<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Swiss cheese model, as Slice uses it</title>
  <desc id="d">Four defensive layers: organisation, supervision, preconditions and unsafe acts. Each has holes. A hazard passes through holes that line up in every layer and is stopped only by a final safeguard, the smart-pump dose limit.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D93025"/></marker>
    <mask id="m0" maskUnits="userSpaceOnUse" x="-10" y="-10" width="140" height="240"><path d="M0,20 L90,0 L110,190 L20,210 Z" fill="white"/><ellipse cx="55" cy="105" rx="13" ry="18" fill="black"/><ellipse cx="40" cy="50" rx="8" ry="10" fill="black"/><ellipse cx="72" cy="165" rx="9" ry="11" fill="black"/></mask><mask id="m1" maskUnits="userSpaceOnUse" x="-10" y="-10" width="140" height="240"><path d="M0,20 L90,0 L110,190 L20,210 Z" fill="white"/><ellipse cx="55" cy="105" rx="13" ry="18" fill="black"/><ellipse cx="70" cy="40" rx="9" ry="11" fill="black"/><ellipse cx="38" cy="160" rx="8" ry="10" fill="black"/></mask><mask id="m2" maskUnits="userSpaceOnUse" x="-10" y="-10" width="140" height="240"><path d="M0,20 L90,0 L110,190 L20,210 Z" fill="white"/><ellipse cx="55" cy="105" rx="13" ry="18" fill="black"/><ellipse cx="35" cy="45" rx="8" ry="10" fill="black"/><ellipse cx="75" cy="160" rx="10" ry="12" fill="black"/></mask><mask id="m3" maskUnits="userSpaceOnUse" x="-10" y="-10" width="140" height="240"><path d="M0,20 L90,0 L110,190 L20,210 Z" fill="white"/><ellipse cx="55" cy="105" rx="13" ry="18" fill="black"/><ellipse cx="68" cy="45" rx="8" ry="10" fill="black"/><ellipse cx="42" cy="165" rx="9" ry="11" fill="black"/></mask>
  </defs>
  <rect width="960" height="400" rx="16" fill="#FFFDF7"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1F2933">Harm happens when the holes line up</text>
  <text x="40" y="70" font-size="14" fill="#52606D">Each near-miss report shows where the holes are. Slice finds the ones that keep lining up.</text>

  <text x="40" y="192" font-size="13" font-weight="700" fill="#D93025">Hazard</text>
  <line x1="95" y1="205" x2="812" y2="205" stroke="#D93025" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>

    <g transform="translate(170,100)">
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="#F7C548" mask="url(#m0)"/>
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="none" stroke="#B7791F" stroke-width="2"/>
      <ellipse cx="55" cy="105" rx="13" ry="18" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="40" cy="50" rx="8" ry="10" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="72" cy="165" rx="9" ry="11" fill="none" stroke="#B7791F" stroke-width="1.5"/>
      <text x="55" y="240" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">Organisation</text>
      <text x="55" y="258" font-size="12" fill="#52606D" text-anchor="middle">short staffing</text>
    </g>
    <g transform="translate(330,100)">
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="#F7C548" mask="url(#m1)"/>
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="none" stroke="#B7791F" stroke-width="2"/>
      <ellipse cx="55" cy="105" rx="13" ry="18" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="70" cy="40" rx="9" ry="11" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="38" cy="160" rx="8" ry="10" fill="none" stroke="#B7791F" stroke-width="1.5"/>
      <text x="55" y="240" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">Supervision</text>
      <text x="55" y="258" font-size="12" fill="#52606D" text-anchor="middle">no double check</text>
    </g>
    <g transform="translate(490,100)">
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="#F7C548" mask="url(#m2)"/>
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="none" stroke="#B7791F" stroke-width="2"/>
      <ellipse cx="55" cy="105" rx="13" ry="18" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="35" cy="45" rx="8" ry="10" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="75" cy="160" rx="10" ry="12" fill="none" stroke="#B7791F" stroke-width="1.5"/>
      <text x="55" y="240" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">Preconditions</text>
      <text x="55" y="258" font-size="12" fill="#52606D" text-anchor="middle">confusing keypad, fatigue</text>
    </g>
    <g transform="translate(650,100)">
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="#F7C548" mask="url(#m3)"/>
      <path d="M0,20 L90,0 L110,190 L20,210 Z" fill="none" stroke="#B7791F" stroke-width="2"/>
      <ellipse cx="55" cy="105" rx="13" ry="18" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="68" cy="45" rx="8" ry="10" fill="none" stroke="#B7791F" stroke-width="1.5"/><ellipse cx="42" cy="165" rx="9" ry="11" fill="none" stroke="#B7791F" stroke-width="1.5"/>
      <text x="55" y="240" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">Unsafe acts</text>
      <text x="55" y="258" font-size="12" fill="#52606D" text-anchor="middle">wrong rate entered</text>
    </g>

  <g transform="translate(820,150)">
    <rect x="0" y="0" width="16" height="110" rx="4" fill="#2F9E44"/>
    <text x="8" y="134" font-size="13" font-weight="700" fill="#2F9E44" text-anchor="middle">The slice</text>
    <text x="8" y="150" font-size="13" font-weight="700" fill="#2F9E44" text-anchor="middle">that held</text>
    <text x="8" y="168" font-size="11" fill="#52606D" text-anchor="middle">pump dose limit</text>
  </g>
  <text x="40" y="384" font-size="12" fill="#7B8794">Model: James Reason, "Human error: models and management", BMJ 2000. Example from Slice's synthetic demo data.</text>
</svg>
